<!DOCTYPE HTML>
<html lang="en">

<head>
    <title>Unsolved Codeforces Problems</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#111115" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <link rel="apple-touch-icon" sizes="57x57" href="https://sta.codeforces.com/s/11868/apple-icon-57x57.png">
    <link rel="apple-touch-icon" sizes="72x72" href="https://sta.codeforces.com/s/11868/apple-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="76x76" href="https://sta.codeforces.com/s/11868/apple-icon-76x76.png">
    <link rel="apple-touch-icon" sizes="114x114" href="https://sta.codeforces.com/s/11868/apple-icon-114x114.png">
    <link rel="apple-touch-icon" sizes="120x120" href="https://sta.codeforces.com/s/11868/apple-icon-120x120.png">
    <link rel="apple-touch-icon" sizes="144x144" href="https://sta.codeforces.com/s/11868/apple-icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="https://sta.codeforces.com/s/11868/apple-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://sta.codeforces.com/s/11868/apple-icon-180x180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="https://sta.codeforces.com/s/11868/android-icon-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="https://sta.codeforces.com/s/11868/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="https://sta.codeforces.com/s/11868/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="https://sta.codeforces.com/s/11868/favicon-16x16.png">
    <meta property="og:title" content="Unsolved Codeforces Problems" />
    <meta property="og:image" content="https://sta.codeforces.com/s/74929/images/codeforces-telegram-square.png" />
    <meta property="og:url" content="https://sadykhzadeh.github.io/unsolved-cf-problems/" />
    <meta property="og:description" content="Website that shows unsolved problems of Codeforces user." />
    <link rel="stylesheet" href="styles/styles.css">
</head>

<body>
    <div id="flags">
        <a href="?lang=en" data-lang="en"><img src="./flags/gb.png" title="In English" alt="In English"></a>
        <a href="?lang=ru" data-lang="ru"><img src="./flags/ru.png" title="По-русски" alt="По-русски"></a>
    </div>
    <h2>Unsolved Codeforces Problems</h2>
    <label class="visually-hidden" for="handle">Codeforces handle</label>
    <input type="text" id="handle" placeholder="Input your handle here." autocomplete="off" spellcheck="false">
    <button type="button" id="start" title="Search unsolved tasks" aria-label="Search unsolved tasks">🔎</button>
    <br>
    <input type="checkbox" id="doNotShowTags">
    <label for="doNotShowTags" id="doNotShowTags-label"></label>
    <button type="button" id="about"></button>
    <!-- Announced as it changes, so a screen reader hears "Loading..." and
         then the count or the error, not silence. -->
    <p id="counter" role="status"></p>
    <p id="freshness" hidden><span id="savedAgo"></span> <button type="button" id="refresh"></button></p>
    <div id="filters" hidden>
        <input type="search" id="searchTask" autocomplete="off" spellcheck="false" aria-keyshortcuts="/">
        <span class="range">
            <label for="minRating" id="ratingFilterLabel"></label>
            <input type="number" id="minRating" min="0" max="4000" step="100" inputmode="numeric" placeholder="800">
            <span aria-hidden="true">-</span>
            <input type="number" id="maxRating" min="0" max="4000" step="100" inputmode="numeric" placeholder="3500">
        </span>
        <select id="tagFilter"></select>
        <span id="shown" aria-live="polite"></span>
    </div>
    <div class="table-scroll">
    <table style="width:100%">
        <thead id="table-main" hidden>
            <tr>
                <th id="numberOfTask" scope="col"><button type="button" class="sort" data-sort="problem">#</button></th>
                <th id="nameTD" scope="col"><button type="button" class="sort" data-sort="name" id="nameLabel"></button></th>
                <th id="tagsTD" scope="col" hidden></th>
                <th id="ratingTD" scope="col"><button type="button" class="sort" data-sort="rating" id="ratingLabel"></button></th>
                <th id="triesTD" scope="col"><button type="button" class="sort" data-sort="tries" id="triesLabel"></button></th>
                <th id="verdictTD" scope="col"></th>
                <th id="lastTriedTD" scope="col"><button type="button" class="sort" data-sort="last" id="lastTriedLabel"></button></th>
            </tr>
        </thead>
        <tbody id="table-list">
        </tbody>
    </table>
    </div>
    <script type="module" src="script.js"></script>
</body>

</html>
